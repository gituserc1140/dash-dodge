<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070614" />
    <meta
      name="description"
      content="Dash Dodge — a frantic pixel dodger. Drag the runner, dash the gaps, and survive the neon rain."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Dash Dodge</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070614'/%3E%3Crect x='3' y='2' width='6' height='3' fill='%23ff4fd8'/%3E%3Crect x='10' y='2' width='3' height='4' fill='%2324e7ff'/%3E%3Crect x='5' y='7' width='6' height='4' fill='%23fff6e0'/%3E%3Crect x='6' y='8' width='4' height='1' fill='%23ff4fd8'/%3E%3Crect x='5' y='11' width='2' height='3' fill='%2324e7ff'/%3E%3Crect x='9' y='11' width='2' height='3' fill='%2324e7ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas
        id="gameCanvas"
        width="180"
        height="320"
        role="img"
        aria-label="Dash Dodge. A tiny pixel runner dodges blocks and spikes. Drag to move, double-tap or press space to dash."
      ></canvas>
    </div>
    <button id="mute" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute sound">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M1.2 6h2.6l3.4-2.6v9.2L3.8 10H1.2z" />
        <path class="wave" fill="none" stroke="currentColor" stroke-width="1.4" d="M9.6 6.1c.9.7.9 2.9 0 3.8" />
        <path class="wave" fill="none" stroke="currentColor" stroke-width="1.4" d="M11.4 4.6c1.8 1.3 1.8 5.5 0 6.8" />
        <path class="slash" fill="none" stroke="currentColor" stroke-width="1.4" d="M9.4 5.2l5 5.6" />
      </svg>
    </button>
    <p class="credit">StudioRApps</p>
    <p id="status" class="sr-only" aria-live="polite">Drag to dodge.</p>
    <noscript>
      <p class="noscript">Dash Dodge needs JavaScript to play.</p>
    </noscript>
    <script src="./game.js"></script>
  </body>
</html>
